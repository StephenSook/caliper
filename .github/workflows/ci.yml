name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Each gate runs on a bare exit path. No pipe, because a pipeline's exit
      # code is its LAST command's and `cmd | tail` silently swallows a failure.
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: No dead Nova Sonic model identifier
        run: |
          if grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' \
               'amazon\.nova-sonic-v1' . ; then
            echo "FAIL: the v1 speech model reached end of life on 2026-09-14"
            exit 1
          fi
          echo "clean: no dead model identifier"
      - name: No em dash or en dash in tracked source
        run: python scripts/check_dashes.py
