name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Each gate runs on a bare exit path. No pipe, because a pipeline's exit
      # code is its LAST command's and `cmd | tail` silently swallows a failure.
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: No end of life Nova Sonic model identifier
        run: python scripts/check_dead_model.py
      - name: No em dash or en dash in tracked source
        run: python scripts/check_dashes.py
      - name: No confidential material or supplied identifier
        run: python scripts/check_confidential.py
