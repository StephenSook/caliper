[project]
name = "caliper"
version = "0.1.0"
description = "Audits a contact center quality scorecard as a measurement instrument before diagnosing any worker from it."
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scipy", "pingouin", "statsmodels", "networkx", "openpyxl",
  "fastapi", "uvicorn[standard]", "websockets", "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
