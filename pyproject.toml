[project]
name = "caliper"
version = "0.1.0"
description = "Audits a contact center quality scorecard as a measurement instrument before diagnosing any worker from it."
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scipy", "pingouin", "statsmodels", "networkx", "openpyxl",
  "fastapi", "uvicorn[standard]", "websockets", "boto3",
  # Nova 2 Sonic bidirectional streaming. boto3 does not carry the operation,
  # and the default aiohttp transport cannot do duplex event streaming, so the
  # AWS Common Runtime transport is required for HTTP/2.
  "aws-sdk-bedrock-runtime", "awscrt",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
