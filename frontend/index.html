<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes the env(safe-area-inset-*) values
         resolve to anything other than zero on a notched phone. Without it the
         insets read 0 and the home indicator sits on top of the content. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />

    <title>CALIPER: audit the instrument, then grade the agent</title>
    <meta
      name="description"
      content="CALIPER measures whether a quality assurance scorecard is good enough to draw a conclusion from, before any training is designed against it."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS reads its own vendor prefixed name for standalone display; the
         unprefixed one is the standard everybody else uses. Both are needed.
         The status bar is opaque rather than translucent on purpose: translucent
         puts the page under the clock, and a measurement readout losing its top
         line to a notch is not a trade worth making. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CALIPER" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CALIPER" />
    <meta
      property="og:description"
      content="Before you measure the agent, check the caliper. All three quality forms have a confidence interval whose lower bound sits at or below zero."
    />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
